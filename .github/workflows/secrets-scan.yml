name: Secrets scan

on:
  workflow_call:

permissions:
  contents: read
  # On a pull request, the Gitleaks action lists the PR's commits through the
  # GitHub API. In a private repo that needs pull-requests: read. The caller
  # must grant it too: a reusable workflow can't get more than the caller gives.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits get scanned too

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # same Gitleaks version as the pre-commit hook (v8.30.1), so local and CI agree
          GITLEAKS_VERSION: "8.30.1"
          # no PR comments (would need pull-requests: write)
          GITLEAKS_ENABLE_COMMENTS: "false"
          # never upload the findings report: it would contain the secret it caught
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"